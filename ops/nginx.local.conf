server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 9m;
    location ^~ /static/ { alias /data/static/; }
    location ^~ /invitation/ {
        access_log off;
        proxy_pass http://web:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto http;
    }
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto http;
    }
}
