{% extends "pilot/base.html" %}
{% block title %}Changer le mot de passe · Amblueo Services{% endblock %}
{% block content %}
<section class="panel narrow">
    <h1>Changer le mot de passe</h1>
    <p>Choisissez une phrase de passe longue et unique, ou utilise un gestionnaire de mots de passe.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button>Enregistrer le nouveau mot de passe</button>
    </form>
</section>
{% endblock %}
